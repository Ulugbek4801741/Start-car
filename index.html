function drawMountains(horizon){

  peaks.forEach(([x,peak,width],i)=>{let px=x*w,base=horizon*.94,top=horizon*peak;ctx.fillStyle=i%2?'#718b91':'#58777f';ctx.beginPath();ctx.moveTo(px-width*w*.38,base);ctx.lineTo(px,top);ctx.lineTo(px+width*w*.42,base);ctx.closePath();ctx.fill();ctx.fillStyle='#e1e8e2';ctx.beginPath();ctx.moveTo(px,top);ctx.lineTo(px-width*w*.10,top+horizon*.2);ctx.lineTo(px+width*w*.13,top+horizon*.17);ctx.closePath();ctx.fill();ctx.fillStyle='#718b91';ctx.fillRect(px-width*w*.22,base-horizon*.12,width*w*.44,horizon*.12)});
  ctx.fillStyle='#718d68';ctx.fillRect(0,horizon*.76,w,horizon*.24);
  for(let i=0;i<15;i++){let x=(i*137+31)%w,y=horizon*(.72+(i%4)*.055),r=5+(i%5)*3;ctx.fillStyle='#315b48';ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fill()}
}
function road(){let horizon=h*.28,bottom=h,segments=48,zone=environmentZone();let sky=ctx.createLinearGradient(0,0,0,horizon+50);if(zone===0){sky.addColorStop(0,'#65a9d0');sky.addColorStop(1,'#f0d2a5')}else if(zone===1){sky.addColorStop(0,'#66b8d0');sky.addColorStop(1,'#d5edf0')}else{sky.addColorStop(0,'#477b9b');sky.addColorStop(1,'#d9e3df')}ctx.fillStyle=sky;ctx.fillRect(0,0,w,horizon+35);if(zone===0){ctx.fillStyle='#c8a071';ctx.fillRect(0,horizon*.58,w,horizon*.42);drawBukhara(horizon)}else if(zone===1){ctx.fillStyle='#77a66c';ctx.fillRect(0,horizon*.58,w,horizon*.42);drawWater(horizon)}else{drawMountains(horizon)}
ctx.fillStyle=zone===2?'#658b63':'#82a96b';ctx.fillRect(0,horizon,w,h-horizon);for(let i=0;i<segments;i++){let y1=horizon+(i/segments)*(bottom-horizon),y2=horizon+((i+1)/segments)*(bottom-horizon);let c1=w/2+curveAt(y1),c2=w/2+curveAt(y2),half1=w*(.25+.23*(i/segments)),half2=w*(.25+.23*((i+1)/segments));ctx.fillStyle=i%2?'#555d67':'#646c76';ctx.beginPath();ctx.moveTo(c1-half1,y1);ctx.lineTo(c1+half1,y1);ctx.lineTo(c2+half2,y2);ctx.lineTo(c2-half2,y2);ctx.closePath();ctx.fill();ctx.fillStyle=i%2?'#fff':'#e84a45';ctx.fillRect(c1-half1-12,y1,12,Math.max(4,y2-y1));ctx.fillRect(c1+half1,y1,12,Math.max(4,y2-y1));ctx.fillStyle='#d7d9d8';ctx.fillRect(c1-half1+8,y1,Math.max(2,w*.003),Math.max(2,y2-y1));ctx.fillRect(c1+half1-10,y1,Math.max(2,w*.003),Math.max(2,y2-y1));if(i%3===0&&zone!==1){let scale=.25+i/segments*.9;ctx.fillStyle=zone===0?'#6d4934':'#315f36';ctx.beginPath();ctx.arc(c1-half1-38*scale,y1,12*scale,0,Math.PI*2);ctx.arc(c1+half1+38*scale,y1,12*scale,0,Math.PI*2);ctx.fill();}}
ctx.strokeStyle='#f5f2e8';ctx.lineWidth=Math.max(3,w*.006);ctx.setLineDash([Math.max(22,h*.05),Math.max(18,h*.035)]);ctx.lineDashOffset=-roadOffset;ctx.beginPath();for(let i=0;i<=segments;i++){let y=horizon+(i/segments)*(h-horizon),c=w/2+curveAt(y);if(i===0)ctx.moveTo(c,y);else ctx.lineTo(c,y)}ctx.stroke();ctx.setLineDash([]);ctx.fillStyle='#ffffff20';for(let i=0;i<18;i++){let y=horizon+(i/18)*(h-horizon),c=w/2+curveAt(y),half=w*(.25+.23*(i/18));ctx.fillRect(c-half+Math.sin(i*91)*30,y,2,3);ctx.fillRect(c+half-Math.cos(i*31)*40,y,2,3);}}
carGrid.querySelectorAll('.car-option').forEach(btn=>btn.onclick=()=>{selectedCar=btn.dataset.car;carGrid.querySelectorAll('.car-option').forEach(x=>x.classList.toggle('selected',x===btn));showSelectedCar();});showSelectedCar();
function drawBots(){bots.forEach(b=>{let phase=((b.progress+trackProgress*.65)%2400)/2400;let y=h*.15+phase*h*.72;let roadHalf=w*(.25+.23*phase);let cx=w/2+curveAt(y)+b.x*roadHalf;drawCar(cx,y,Math.max(.22,Math.min(.75,.22+phase*.55)),b.color);});}
function frame(t){let dt=Math.min((t-last)/1000,.05);last=t;if(started){const maxSpeed=cars[selectedCar].max;const steerInput=(keys.right?1:0)-(keys.left?1:0);steerVelocity+=(steerInput*(.65+speed/260)-steerVelocity*3.0)*dt;steeringAngle=Math.max(-.42,Math.min(.42,steerVelocity*.28));if(keys.gas)speed=Math.min(maxSpeed,speed+(42+(maxSpeed-speed)*.12)*dt);else speed=Math.max(0,speed-(4+speed*.018)*dt);if(keys.brake)speed=Math.max(0,speed-155*dt);playerX+=steerVelocity*(.35+speed/150)*150*dt;const roadLimit=w*(.25+.23*.78)*.92;playerX=Math.max(-roadLimit,Math.min(roadLimit,playerX));const offRoad=Math.abs(playerX)>roadLimit*.78;if(offRoad)speed=Math.max(0,speed-48*dt);roadOffset=(roadOffset+speed*dt*2.6)%64;trackProgress+=speed*dt*.9;raceElapsed+=dt;const nextGear=Math.max(1,Math.min(7,1+Math.floor(speed/48)));if(nextGear!==gear){gear=nextGear;shiftFlash=.22}shiftFlash=Math.max(0,shiftFlash-dt);const gearTop=[0,48,96,144,192,240,288,360][gear];rpm=850+(Math.min(1,speed/Math.max(1,gearTop)))*5900;if(engineAudio&&engineOsc&&engineGain){engineOsc.frequency.setTargetAtTime(42+rpm/38,engineAudio.currentTime,.06);engineGain.gain.setTargetAtTime(started?(.018+speed/9000):.0001,engineAudio.currentTime,.08)}bots.forEach(b=>b.progress+=b.speed*dt);raceSeconds=Math.max(0,raceSeconds-dt);if(raceSeconds<=0&&!finishReached){finishReached=true;started=false;speed=0;document.querySelector('#overlay').style.display='flex';document.querySelector('.panel h1').textContent='FINISH! 🏁';document.querySelector('.panel p').textContent='Poyga tugadi! Botlar bilan poyga yakunlandi.';document.querySelector('#start').textContent='RESTART';}}
ctx.clearRect(0,0,w,h);road();let px=w/2+curveAt(h*.78)+playerX,py=h*.78;if(Math.abs(steerVelocity)>.42&&speed>95){skidMarks.push([px-13,py+23,px+13,py+23]);if(skidMarks.length>70)skidMarks.shift()}ctx.save();ctx.strokeStyle='#17191dcc';ctx.lineWidth=4;skidMarks.forEach(m=>{ctx.beginPath();ctx.moveTo(m[0],m[1]);ctx.lineTo(m[0]+2,m[1]+14);ctx.moveTo(m[2],m[3]);ctx.lineTo(m[2]+2,m[3]+14);ctx.stroke()});ctx.restore();drawBots();drawCar(px,py,Math.max(.65,Math.min(1.2,h/700)),cars[selectedCar].color,steeringAngle,Number(selectedCar.replace('car','')));document.querySelector('#speed').textContent=Math.round(speed)+' km/h';document.querySelector('#telemetry').textContent=gear+'-GEAR · '+Math.round(rpm)+' RPM'+(shiftFlash>0?' ⚡':'');let mm=Math.floor(raceSeconds/60),ss=Math.floor(raceSeconds%60);document.querySelector('#raceHud').textContent=mm+':'+String(ss).padStart(2,'0')+' · BOT '+bots.length;document.querySelector('#locationHud').textContent=['BUXORO ESKI SHAHAR','SUV BO‘YI TRASSASI','TOG‘LI HUDUD'][environmentZone()];requestAnimationFrame(frame)}requestAnimationFrame(frame);
document.querySelector('#start').addEventListener('click',()=>{initEngineAudio();if(engineAudio)engineAudio.resume();started=true;finishReached=false;raceSeconds=Number(document.querySelector('#duration').value);raceElapsed=0;trackProgress=0;playerX=0;speed=0;gear=1;rpm=850;shiftFlash=0;steerVelocity=0;steeringAngle=0;skidMarks=[];bots.forEach((b,i)=>b.progress=160+i*370);document.querySelector('.panel h1').textContent='START-CAR 🏁';document.querySelector('.panel p').textContent='Avtomobilni tanlang va poygani boshlang.';document.querySelector('#start').textContent='RACE START';document.querySelector('#overlay').style.display='none';});
document.querySelectorAll('[data-key]').forEach(b=>{const k=b.dataset.key;const press=e=>{e.preventDefault();keys[k]=true;b.classList.add('active');try{b.setPointerCapture(e.pointerId)}catch(_){}};const release=e=>{if(e)e.preventDefault();keys[k]=false;b.classList.remove('active')};b.addEventListener('pointerdown',press);['pointerup','pointercancel','lostpointercapture'].forEach(ev=>b.addEventListener(ev,release));b.addEventListener('contextmenu',e=>e.preventDefault());});
addEventListener('keydown',e=>{if(e.key==='ArrowLeft'||e.key==='a')keys.left=true;if(e.key==='ArrowRight'||e.key==='d')keys.right=true;if(e.key==='ArrowUp'||e.key==='w')keys.gas=true;if(e.key==='ArrowDown'||e.key==='s')keys.brake=true});
addEventListener('keyup',e=>{if(e.key==='ArrowLeft'||e.key==='a')keys.left=false;if(e.key==='ArrowRight'||e.key==='d')keys.right=false;if(e.key==='ArrowUp'||e.key==='w')keys.gas=false;if(e.key==='ArrowDown'||e.key==='s')keys.brake=false});
</script></body></html>
