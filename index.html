<!doctype html>
<html lang="uz"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#050910"><title>START-CAR — Racing</title>
<style>
:root{--bg:#050910;--panel:#0a1421;--line:#ffffff18;--muted:#90a5ba;--red:#ff4b36;--cyan:#52d9f5;--green:#50e0a1}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:#f7fbff;font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;touch-action:none}
canvas#race{position:absolute;inset:0;width:100%;height:100%;display:block}
#raceScreen{position:absolute;inset:0;pointer-events:none}
.topbar{position:absolute;left:0;right:0;top:0;padding:calc(env(safe-area-inset-top) + 12px) 14px 0;display:flex;align-items:center;justify-content:space-between;gap:8px}
.brand{font-size:12px;letter-spacing:2.8px;font-weight:1000}.brand b{color:var(--red)}
.hudpill{background:#06101dc9;border:1px solid var(--line);border-radius:12px;padding:8px 11px;font-size:10px;font-weight:900;letter-spacing:1px;backdrop-filter:blur(16px)}
.pause{pointer-events:auto;border:1px solid #ffffff24;background:#0b1725;color:#fff;border-radius:12px;width:40px;height:38px;font-size:15px;font-weight:900}
.speedPanel{position:absolute;right:14px;top:calc(env(safe-area-inset-top) + 68px);width:116px;padding:11px 13px;background:linear-gradient(145deg,#091522e8,#030a13e8);border:1px solid var(--line);border-radius:17px;text-align:right;box-shadow:0 12px 32px #0006}
.speedValue{font-size:43px;font-weight:1000;letter-spacing:-3px;line-height:.9}.speedUnit{font-size:9px;letter-spacing:2px;color:#9eb4c9;font-weight:900}
.leftHUD{position:absolute;left:14px;top:calc(env(safe-area-inset-top) + 68px);display:flex;flex-direction:column;gap:8px}
.nitroPanel{min-width:120px;background:#06101dcc;border:1px solid var(--line);border-radius:15px;padding:10px;backdrop-filter:blur(12px)}.nitroTitle{font-size:9px;font-weight:1000;letter-spacing:1.5px;color:#c6d8e9;display:flex;justify-content:space-between;gap:14px}.nitroTrack{height:5px;margin-top:8px;border-radius:20px;background:#233548;overflow:hidden}.nitroFill{height:100%;width:100%;background:linear-gradient(90deg,#32b8ff,#7ce8ff);box-shadow:0 0 12px #52d9f555}
.timePanel{position:absolute;top:calc(env(safe-area-inset-top) + 137px);right:14px;border:1px solid #ffffff22;border-radius:11px;padding:8px 11px;background:#081320d9;font-variant-numeric:tabular-nums;font-size:12px;font-weight:1000;letter-spacing:1.2px}
.trackInfo{position:absolute;left:14px;right:14px;bottom:calc(env(safe-area-inset-bottom) + 142px);display:flex;justify-content:space-between;gap:8px}.trackChip{border:1px solid #ffffff1b;background:#06111bd6;border-radius:11px;padding:8px 10px;font-size:9px;letter-spacing:1px;font-weight:1000;backdrop-filter:blur(10px)}
.controls{position:absolute;bottom:calc(env(safe-area-inset-bottom) + 13px);left:0;right:0;padding:0 14px;display:flex;justify-content:space-between;align-items:end;pointer-events:none}.controlCluster{display:flex;gap:8px;pointer-events:auto}
.ctrl{width:clamp(52px,14vw,68px);height:clamp(52px,14vw,68px);border-radius:18px;border:1px solid #ffffff30;color:#f5f9ff;background:linear-gradient(145deg,#17283b,#07111e);box-shadow:0 8px 24px #0006,inset 0 1px #ffffff1a;font-size:19px;font-weight:1000;display:grid;place-items:center;touch-action:none;user-select:none}
.ctrl:active,.ctrl.active{transform:scale(.94);filter:brightness(1.35)}.ctrl.gas{background:linear-gradient(145deg,#23bc79,#087246);border-color:#63e8a9}.ctrl.brake{background:linear-gradient(145deg,#fa584a,#8d2426);font-size:11px}.ctrl.nitro{background:linear-gradient(145deg,#198eea,#15428c);border-color:#62baff;font-size:16px}
#garage,#overlay{position:absolute;inset:0;z-index:5;display:flex;align-items:center;justify-content:center;padding:16px;background:radial-gradient(ellipse at 50% 38%,#233449 0%,#0b1421 45%,#040810 100%)}
.garageCard{width:min(100%,560px);max-height:94dvh;overflow:auto;border:1px solid #ffffff20;border-radius:26px;background:linear-gradient(150deg,#121e2d,#070d16 72%);box-shadow:0 30px 100px #000b;padding:18px}
.garageHead{display:flex;align-items:center;justify-content:space-between}.eyebrow{font-size:9px;color:var(--cyan);font-weight:1000;letter-spacing:3px}.logoTitle{margin:4px 0 0;font-size:clamp(27px,8vw,38px);font-weight:1000;letter-spacing:1px}.logoTitle span{color:var(--red)}.season{font-size:9px;color:#9db1c7;letter-spacing:1.2px;font-weight:900}
.preview{position:relative;height:clamp(150px,28vh,220px);margin-top:15px;border:1px solid #ffffff17;border-radius:19px;overflow:hidden;background:radial-gradient(ellipse at 50% 90%,#3e556c,#111c2a 55%,#08111c)}.preview:before{content:"GARAGE  /  VEHICLE SELECT";position:absolute;top:12px;left:12px;z-index:1;font-size:9px;letter-spacing:2px;color:#9db6ce;font-weight:1000}.preview canvas{position:relative;width:100%;height:100%}
.selectedName{display:flex;justify-content:space-between;align-items:end;margin:12px 2px 7px}.selectedName strong{font-size:15px;font-weight:1000}.selectedName small{font-size:10px;color:#9bb2c7;font-weight:900}
.carList{display:grid;grid-template-columns:repeat(2,1fr);gap:7px;max-height:22dvh;overflow:auto;margin:8px 0 13px;touch-action:pan-y}
.carOption{border:1px solid #ffffff16;background:#0b1725;color:white;border-radius:12px;padding:10px;text-align:left;font-size:11px;font-weight:900;touch-action:manipulation}.carOption span{display:block;color:#91a8bf;font-size:9px;margin-top:4px}.carOption.active{border-color:#ff614c;background:linear-gradient(130deg,#3a2930,#142131);box-shadow:0 0 0 1px #ff59472b}
.startBtn{width:100%;padding:15px;border:0;border-radius:14px;color:#fff;font-size:13px;font-weight:1000;letter-spacing:1px;background:linear-gradient(100deg,#f3453b,#ff8a3d);box-shadow:0 12px 24px #ff50332a;touch-action:manipulation}.garageFooter{text-align:center;margin-top:10px;color:#7890a8;font-size:9px;letter-spacing:1px}
#overlay{background:#020711cc;backdrop-filter:blur(14px);z-index:10}#overlay.hidden,#garage.hidden,.hidden{display:none!important}.overlayCard{width:min(92%,390px);border:1px solid #ffffff20;border-radius:23px;background:linear-gradient(145deg,#17283b,#07111d);padding:22px;text-align:center}.overlayCard h2{font-size:26px;margin:0 0 7px;font-weight:1000}.overlayCard p{color:#9db2c8;font-size:12px;margin:0 0 17px}.overlayCard .startBtn+.startBtn{margin-top:9px;background:linear-gradient(100deg,#263e55,#102236)}
@media(max-height:650px){.garageCard{padding:13px}.preview{height:120px;margin-top:8px}.carList{max-height:18dvh}.trackInfo{bottom:116px}.speedValue{font-size:36px}}
</style></head>
<body>
<canvas id="race"></canvas>
<div id="raceScreen" class="hidden">
<div class="topbar"><div class="brand">START<b>-CAR</b></div><div class="hudpill" id="position">POSITION 1 / 5</div><div class="hudpill" id="zone">BUKHARA</div><button class="pause" id="pause">Ⅱ</button></div>
<div class="leftHUD"><div class="nitroPanel"><div class="nitroTitle"><span>⚡ NITRO</span><span id="nitroText">100%</span></div><div class="nitroTrack"><div class="nitroFill" id="nitroBar"></div></div></div></div>
<div class="speedPanel"><div class="speedValue" id="speed">0</div><div class="speedUnit">KM / H</div></div><div class="timePanel" id="timer">05:00</div>
<div class="trackInfo"><div class="trackChip" id="distance">TRACK 0%</div><div class="trackChip" id="status">READY</div></div>
<div class="controls"><div class="controlCluster"><button class="ctrl" data-action="left">◀</button><button class="ctrl" data-action="right">▶</button></div><div class="controlCluster"><button class="ctrl brake" data-action="brake">BRAKE</button><button class="ctrl gas" data-action="gas">▲</button><button class="ctrl nitro" data-action="nitro">⚡</button></div></div></div>
<div id="garage"><div class="garageCard"><div class="garageHead"><div><div class="eyebrow">MOBILE RACING SIMULATION</div><h1 class="logoTitle">START<span>-CAR</span></h1></div><div class="season">RACE<br>01 / 05</div></div><div class="preview"><canvas id="preview" width="500" height="230"></canvas></div><div class="selectedName"><strong id="carName">BMW M4</strong><small id="carSpeed">TOP SPEED · 290 KM/H</small></div><div class="carList" id="cars"></div><button class="startBtn" id="start">IGNITION — POYGANI BOSHLASH</button><div class="garageFooter">BUKHARA · RIVERSIDE · MOUNTAINS · NIGHT CITY</div></div></div>
<div id="overlay" class="hidden"><div class="overlayCard"><h2 id="overlayTitle">PAUZA</h2><p id="overlayMessage">Poyga vaqtincha to‘xtatildi</p><button class="startBtn" id="resume">DAVOM ETISH</button><button class="startBtn" id="restart">QAYTA START</button></div></div>
<script>
(()=>{'use strict';
const canvas=document.getElementById('race'),ctx=canvas.getContext('2d'),preview=document.getElementById('preview'),pctx=preview.getContext('2d');
const cars=[['BMW M4',290,'#2e91ff'],['Bugatti Chiron',420,'#d6a837'],['Lamborghini Huracan',325,'#ffb72d'],['Ferrari SF90',340,'#e83836'],['Porsche 911 GT3',318,'#e8e9ec'],['Mercedes AMG GT',310,'#39b9aa'],['Audi R8',310,'#a55be0'],['McLaren 720S',341,'#f67e32'],['Nissan GT-R',315,'#f5f5f5'],['Toyota Supra',280,'#e84b66']];
const botNames=['Asilbek','Sadoqat','Sevench','Ulugbek'],botColors=['#ffbd37','#56c7fa','#b884fa','#58d98a'];
let selected=0,W=0,H=0,dpr=1,started=false,paused=false,crashed=false,finished=false,speed=0,lane=0,steer=0,nitro=100,elapsed=0,remaining=300,dist=0,shake=0,last=0,keys={};
let bots=botNames.map((name,i)=>({name,color:botColors[i],lane:[.45,-.5,.15,-.15][i],progress:500+i*600,speed:150+i*10}));
function resize(){dpr=Math.min(devicePixelRatio||1,1.5);W=innerWidth;H=innerHeight;canvas.width=W*dpr;canvas.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0)}addEventListener('resize',resize);resize();
function drawCar(c,x,y,scale,player=false,color){c.save();c.translate(x,y);c.scale(scale,scale);const col=player?cars[selected][2]:(color||'#4b8fdd');
c.fillStyle='#0008';c.beginPath();c.ellipse(0,8,33,43,0,0,Math.PI*2);c.fill();
c.fillStyle='#070a0f';c.strokeStyle='#46515e';c.lineWidth=2;for(let yy of [-23,20])for(let xx of [-22,22]){c.beginPath();c.roundRect(xx-5,yy-10,10,20,3);c.fill();c.stroke();c.fillStyle='#9eabb7';c.beginPath();c.arc(xx,yy,3,0,Math.PI*2);c.fill();c.fillStyle='#070a0f'}
c.fillStyle='#111820';c.beginPath();c.roundRect(-24,21,48,16,5);c.fill();c.fillStyle='#303b47';c.beginPath();c.roundRect(-19,24,38,8,3);c.fill();
c.shadowColor='#0009';c.shadowBlur=9;c.shadowOffsetY=3;c.fillStyle=col;c.beginPath();c.moveTo(-15,37);c.quadraticCurveTo(-27,30,-25,12);c.lineTo(-22,-20);c.quadraticCurveTo(-19,-36,-11,-41);c.quadraticCurveTo(0,-46,11,-41);c.quadraticCurveTo(20,-36,22,-20);c.lineTo(25,12);c.quadraticCurveTo(27,30,15,37);c.quadraticCurveTo(0,42,-15,37);c.closePath();c.fill();c.shadowBlur=0;c.shadowOffsetY=0;
c.fillStyle='#ffffff25';c.beginPath();c.moveTo(-18,8);c.quadraticCurveTo(-18,-27,-10,-36);c.lineTo(-6,-33);c.quadraticCurveTo(-11,-14,-10,13);c.lineTo(-14,30);c.closePath();c.fill();c.fillStyle='#111d2a';c.beginPath();c.moveTo(-13,-27);c.quadraticCurveTo(-10,-37,-5,-37);c.lineTo(5,-37);c.quadraticCurveTo(11,-35,13,-27);c.lineTo(11,-10);c.lineTo(-11,-10);c.closePath();c.fill();c.fillStyle='#67c9ed40';c.beginPath();c.moveTo(-10,-29);c.lineTo(-6,-35);c.lineTo(-3,-35);c.lineTo(-5,-14);c.lineTo(-10,-14);c.closePath();c.fill();c.strokeStyle='#080e16';c.lineWidth=2;c.beginPath();c.moveTo(-12,-8);c.lineTo(12,-8);c.stroke();c.fillStyle='#121a24';c.beginPath();c.roundRect(-19,-4,38,5,2);c.fill();
c.fillStyle='#ff3038';c.shadowColor='#ff2535';c.shadowBlur=player&&keys.brake?13:4;c.beginPath();c.roundRect(-19,14,9,8,2);c.roundRect(10,14,9,8,2);c.fill();c.shadowBlur=0;c.fillStyle='#ffb4b6';c.fillRect(-17,16,5,2);c.fillRect(12,16,5,2);c.fillStyle='#d7e0e8';c.beginPath();c.roundRect(-7,25,14,5,1);c.fill();c.fillStyle='#090d12';c.beginPath();c.roundRect(-15,32,5,4,2);c.roundRect(10,32,5,4,2);c.fill();if(player&&keys.nitro&&nitro>0){c.fillStyle='#32baff';c.shadowColor='#28aaff';c.shadowBlur=14;c.beginPath();c.moveTo(-9,36);c.lineTo(-6,53);c.lineTo(0,42);c.lineTo(6,53);c.lineTo(9,36);c.fill();c.shadowBlur=0}c.restore()}
function previewCar(){pctx.clearRect(0,0,500,230);let g=pctx.createRadialGradient(250,150,4,250,150,225);g.addColorStop(0,'#324b65');g.addColorStop(1,'#09131e');pctx.fillStyle=g;pctx.fillRect(0,0,500,230);pctx.fillStyle='#111a25';pctx.beginPath();pctx.ellipse(250,183,170,25,0,0,Math.PI*2);pctx.fill();drawCar(pctx,250,130,2.05,true)}
const grid=document.getElementById('cars');grid.innerHTML=cars.map((c,i)=>'<button class="carOption'+(i===selected?' active':'')+'" data-car="'+i+'">'+c[0]+'<span>MAX '+c[1]+' KM/H</span></button>').join('');
grid.addEventListener('click',e=>{let b=e.target.closest('[data-car]');if(!b)return;selected=+b.dataset.car;grid.querySelectorAll('.carOption').forEach(x=>x.classList.toggle('active',+x.dataset.car===selected));document.getElementById('carName').textContent=cars[selected][0];document.getElementById('carSpeed').textContent='TOP SPEED · '+cars[selected][1]+' KM/H';previewCar()});previewCar();
function center(y){let n=(H-y)/Math.max(H,1);return Math.sin(dist*.00045+n*2.3)*W*.18+Math.sin(dist*.00013+n*6)*W*.06}
function zoneName(){let p=dist%36000;return p<9000?'BUKHARA OLD CITY':p<18000?'RIVERSIDE':p<27000?'MOUNTAIN ROAD':'NIGHT CITY'}
function road(){let horizon=H*.3,phase=dist%36000,z=Math.floor(phase/9000),sky=['#91c7ed','#79cdd8','#a3b7c6','#132946'][z],land=['#b89a70','#357f8e','#577956','#384b61'][z];let skyG=ctx.createLinearGradient(0,0,0,horizon);skyG.addColorStop(0,sky);skyG.addColorStop(1,'#e2d8c6');ctx.fillStyle=skyG;ctx.fillRect(0,0,W,horizon);ctx.fillStyle=land;ctx.fillRect(0,horizon,W,H-horizon);
if(z===0){for(let side of [-1,1])for(let i=0;i<12;i++){let x=side<0?i*W*.065:W*.72+i*W*.045,bw=W*.06,bh=horizon*(.3+(i%4)*.1);ctx.fillStyle=['#b78654','#d2ac79','#997047'][i%3];ctx.fillRect(x,horizon-bh,bw,bh);ctx.fillStyle='#64442d';for(let j=0;j<3;j++)ctx.fillRect(x+bw*(.2+j*.25),horizon-bh*.58,bw*.12,bh*.18)}}
if(z===1){ctx.fillStyle='#23889a';ctx.fillRect(0,horizon*.63,W,horizon*.37);for(let i=0;i<65;i++){ctx.fillStyle='#b7f0ec40';ctx.fillRect((i*71+dist*.12)%W,horizon*.65+(i*9)%Math.max(1,horizon*.28),22,2)}}
if(z===2){for(let i=0;i<12;i++){let x=i*W*.12-W*.04;ctx.fillStyle=i%2?'#637f8b':'#486a7c';ctx.beginPath();ctx.moveTo(x,horizon);ctx.lineTo(x+W*.1,horizon*.2+(i%4)*horizon*.06);ctx.lineTo(x+W*.2,horizon);ctx.fill()}}
if(z===3){for(let side of [-1,1])for(let i=0;i<14;i++){let x=side<0?i*W*.065-W*.02:W*.7+i*W*.055,bw=W*.05,bh=horizon*(.3+(i%5)*.12);ctx.fillStyle=['#71899a','#526b80','#98aab5'][i%3];ctx.fillRect(x,horizon-bh,bw,bh);ctx.fillStyle='#d9f1ff';for(let j=0;j<5;j++)ctx.fillRect(x+bw*.14+j*bw*.16,horizon-bh*.75,bw*.07,bh*.04)}}
let seg=54;for(let i=0;i<seg;i++){let p=i/seg,q=(i+1)/seg,y1=horizon+p*(H-horizon),y2=horizon+q*(H-horizon),c1=W/2+center(y1),c2=W/2+center(y2),rw1=W*(.085+p*.42),rw2=W*(.085+q*.42);ctx.fillStyle=i%2?'#303941':'#3d444b';ctx.beginPath();ctx.moveTo(c1-rw1,y1);ctx.lineTo(c1+rw1,y1);ctx.lineTo(c2+rw2,y2);ctx.lineTo(c2-rw2,y2);ctx.closePath();ctx.fill();ctx.fillStyle=i%2?'#f5eee5':'#e64d44';ctx.fillRect(c1-rw1-6,y1,6,y2-y1+1);ctx.fillRect(c1+rw1,y1,6,y2-y1+1);if(i%4===0){ctx.fillStyle='#e9e6de';ctx.fillRect(c1-2,y1,4,y2-y1+1)}}}
function drawBot(b){let r=b.progress-dist;if(r<0||r>6500)return;let t=1-r/6500,y=H*.3+t*H*.62,s=.28+t*.62,x=W/2+center(y)+b.lane*W*(.36+t*.17);drawCar(ctx,x,y,s,false,b.color);ctx.font='900 10px system-ui';ctx.textAlign='center';ctx.fillStyle='#fff';ctx.fillText(b.name,x,y-s*49)}
function overlay(title,msg){document.getElementById('overlayTitle').textContent=title;document.getElementById('overlayMessage').textContent=msg;document.getElementById('overlay').classList.remove('hidden')}
function startRace(){started=true;paused=crashed=finished=false;elapsed=0;remaining=300;dist=speed=lane=steer=0;nitro=100;keys={};bots.forEach((b,i)=>{b.progress=500+i*600;b.lane=[.4,-.5,.15,-.15][i]});document.getElementById('garage').classList.add('hidden');document.getElementById('overlay').classList.add('hidden');document.getElementById('raceScreen').classList.remove('hidden');document.getElementById('status').textContent='RACE'}
function update(dt){if(!started||paused||crashed||finished)return;elapsed+=dt;remaining=Math.max(0,300-elapsed);if(!remaining){finished=true;overlay('FINISH','Poyga vaqti yakunlandi.');return}let gas=keys.gas?1:0,br=keys.brake?1:0,boost=keys.nitro&&nitro>0;speed+=gas*cars[selected][1]*1.1*dt;speed-=(5+speed*.03)*dt;if(br)speed-=220*dt;if(boost){speed+=220*dt;nitro=Math.max(0,nitro-36*dt)}else nitro=Math.min(100,nitro+10*dt);speed=Math.max(0,Math.min(cars[selected][1]*(boost?1.15:1),speed));let target=(keys.right?1:0)-(keys.left?1:0);steer+=(target-steer)*Math.min(1,dt*7);lane=Math.max(-1.15,Math.min(1.15,lane+steer*(speed/Math.max(cars[selected][1],1))*dt*1.35));dist+=speed*dt*.9;
bots.forEach(b=>{b.progress+=b.speed*dt;if(b.progress-dist>6200)b.progress=dist+400+Math.random()*1500;b.lane=Math.sin(elapsed*.45+b.speed)*.45});for(let b of bots){if(Math.abs(b.progress-dist)<230&&Math.abs(b.lane-lane)<.28){crashed=true;speed=0;keys={};document.getElementById('status').textContent='CRASH';overlay('AVARIYA 💥','Mashinalar to‘qnashdi. Qayta start bosing.');break}}
if(Math.abs(lane)>1.02)speed=Math.max(0,speed-55*dt);document.getElementById('speed').textContent=Math.round(speed);document.getElementById('nitroText').textContent=Math.round(nitro)+'%';document.getElementById('nitroBar').style.width=nitro+'%';document.getElementById('timer').textContent=Math.floor(remaining/60).toString().padStart(2,'0')+':'+Math.floor(remaining%60).toString().padStart(2,'0');document.getElementById('distance').textContent='TRACK '+Math.min(100,Math.floor(dist/27000*100))+'%';document.getElementById('zone').textContent=zoneName();document.getElementById('position').textContent='POS '+(1+bots.filter(b=>b.progress>dist).length)+' / 5';document.getElementById('status').textContent=boost?'NITRO':speed>120?'RACE':'READY'}
document.getElementById('start').addEventListener('click',startRace);document.getElementById('pause').addEventListener('click',()=>{if(!started||finished||crashed)return;paused=!paused;if(paused)overlay('PAUSE','Poyga vaqtincha to‘xtatildi');else document.getElementById('overlay').classList.add('hidden')});document.getElementById('resume').addEventListener('click',()=>{paused=false;document.getElementById('overlay').classList.add('hidden')});document.getElementById('restart').addEventListener('click',startRace);
document.querySelectorAll('[data-action]').forEach(b=>{let a=b.dataset.action;let down=e=>{e.preventDefault();keys[a]=true;b.classList.add('active');try{b.setPointerCapture(e.pointerId)}catch(_){}};let up=e=>{if(e)e.preventDefault();keys[a]=false;b.classList.remove('active')};b.addEventListener('pointerdown',down);['pointerup','pointercancel','lostpointercapture'].forEach(v=>b.addEventListener(v,up));b.addEventListener('click',e=>e.preventDefault())});
addEventListener('keydown',e=>{let m={ArrowLeft:'left',a:'left',ArrowRight:'right',d:'right',ArrowUp:'gas',w:'gas',ArrowDown:'brake',s:'brake',Shift:'nitro',Escape:'pause'};if(m[e.key]){e.preventDefault();keys[m[e.key]]=true;if(e.key==='Escape'&&started){paused=true;overlay('PAUSE','Poyga vaqtincha to‘xtatildi')}}});addEventListener('keyup',e=>{let m={ArrowLeft:'left',a:'left',ArrowRight:'right',d:'right',ArrowUp:'gas',w:'gas',ArrowDown:'brake',s:'brake',Shift:'nitro'};if(m[e.key])keys[m[e.key]]=false});
function frame(t){let dt=Math.min(.04,Math.max(0,(t-last)/1000||0));last=t;update(dt);ctx.save();if(shake)ctx.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);ctx.clearRect(0,0,W,H);road();bots.forEach(drawBot);let py=H*.80,px=W/2+center(py)+lane*W*.33;drawCar(ctx,px,py,Math.max(.75,Math.min(1.3,H/700)),true);ctx.restore();requestAnimationFrame(frame)}requestAnimationFrame(frame);
})();
</script></body></html>
