async function loadCarImage(index){const [name]=carCatalog[index];try{const api='https://commons.wikimedia.org/w/api.php?action=query&generator=search&gsrnamespace=6&gsrlimit=8&gsrsearch='+encodeURIComponent(name+' car')+'&prop=imageinfo&iiprop=url&iiurlwidth=420&format=json&origin=*';const response=await fetch(api);if(!response.ok)throw new Error('image search failed');const data=await response.json();const pages=Object.values(data.query?.pages||{});const tokens=name.toLowerCase().replace(/[^a-z0-9 ]/g,' ').split(/\s+/).filter(x=>x.length>2);let best=null,bestScore=-1;for(const page of pages){const title=(page.title||'').toLowerCase();const score=tokens.reduce((n,t)=>n+(title.includes(t)?1:0),0);const url=page.imageinfo?.[0]?.thumburl||page.imageinfo?.[0]?.url;if(url&&score>bestScore){best={url,title:page.title};bestScore=score}}if(best&&bestScore>=2){carImageCache['car'+index]=best.url;const img=carGrid.querySelector('[data-car="car'+index+'"] img');if(img)img.src=best.url;img?.setAttribute('referrerpolicy','no-referrer');if(selectedCar==='car'+index)showSelectedCar()}}catch(e){/* keep neutral placeholder when no verified image is found */}}
