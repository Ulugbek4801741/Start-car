<!doctype html>
<html lang="uz"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#07111c"><title>START-CAR | Racing</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#07111c;color:#fff;font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;touch-action:none}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
#hud{position:absolute;inset:0;pointer-events:none;padding:calc(env(safe-area-inset-top) + 10px) 12px 12px}
.top{display:flex;justify-content:space-between;align-items:center;gap:7px}.brand{font-size:15px;font-weight:1000;letter-spacing:2px;text-shadow:0 3px 15px #000}.brand span{color:#ff4c37}
.stat{background:linear-gradient(145deg,#0b1a2bdc,#07111ddc);border:1px solid #ffffff26;border-radius:13px;padding:8px 10px;backdrop-filter:blur(14px);font-size:10px;font-weight:900;letter-spacing:.6px;white-space:nowrap;box-shadow:0 6px 18px #0003}
.pauseBtn{pointer-events:auto;background:#101f31;color:#fff;border:1px solid #ffffff35;border-radius:12px;padding:9px 12px;font-size:16px;font-weight:900;touch-action:manipulation}
.speedBox{position:absolute;right:12px;top:78px;text-align:right;background:linear-gradient(140deg,#101e31e8,#07131de8);padding:10px 14px 8px;border-radius:18px;border:1px solid #ffffff24;box-shadow:0 10px 25px #0004}.speed{font-size:clamp(36px,10vw,52px);font-weight:1000;line-height:.95;letter-spacing:-2px}.speedBox small{font-size:10px;color:#a8c7dc;letter-spacing:2px;font-weight:900}
.meters{position:absolute;left:12px;top:78px;display:grid;gap:7px}.meter{height:7px;width:110px;border-radius:10px;background:#23374a;overflow:hidden}.meter i{display:block;height:100%;width:100%;background:linear-gradient(90deg,#22c9f3,#398aff);border-radius:10px;box-shadow:0 0 10px #28a9ff55}
.timeBox{position:absolute;top:142px;right:12px;font-weight:1000;letter-spacing:1px;background:#081626d9;border:1px solid #ffffff20;padding:8px 12px;border-radius:12px;font-variant-numeric:tabular-nums}
.bottomHud{position:absolute;bottom:130px;left:12px;right:12px;display:flex;justify-content:space-between;gap:7px;font-size:10px;font-weight:1000;letter-spacing:.5px}.chip{padding:8px 10px;background:#071522ce;border:1px solid #ffffff20;border-radius:12px;backdrop-filter:blur(8px)}
.controls{position:absolute;bottom:max(14px,env(safe-area-inset-bottom));left:0;right:0;display:flex;justify-content:space-between;align-items:flex-end;padding:0 12px;pointer-events:none}.ctrlGroup{display:flex;gap:8px;pointer-events:auto}
.btn{width:clamp(54px,15vw,74px);height:clamp(54px,15vw,74px);border:1px solid #ffffff38;background:linear-gradient(145deg,#20344cdd,#0b1b2ddd);color:white;border-radius:21px;font-weight:1000;box-shadow:0 8px 22px #0005,inset 0 1px #ffffff20;touch-action:none;user-select:none;-webkit-user-select:none;display:grid;place-items:center;pointer-events:auto}
.btn.active{filter:brightness(1.25);transform:scale(.95)}.btn.gas{background:linear-gradient(145deg,#31cf73,#117346);border-color:#70f0a0}.btn.nitro{background:linear-gradient(145deg,#38a9ff,#1552bd);height:58px}.btn.brake{background:linear-gradient(145deg,#ff6756,#a5272a);height:58px}.steer{font-size:29px}
#menu,#pauseLayer{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:12px;background:linear-gradient(125deg,#030a13e8,#0b1728c9 60%,#101c2ae8);backdrop-filter:blur(10px);z-index:30}
.card{width:min(96%,500px);max-height:94dvh;overflow:auto;background:linear-gradient(160deg,#1b2d43,#0a1421 75%);border:1px solid #ffffff20;border-radius:26px;padding:18px;box-shadow:0 28px 90px #000b,inset 0 1px #ffffff12}
.title{font-size:28px;font-weight:1000;letter-spacing:1.5px;margin:0;text-shadow:0 4px 18px #0005}.title em{font-style:normal;color:#ff5947}.subtitle{color:#b5c9dc;font-size:12px;margin:4px 0 12px}
.preview{height:clamp(110px,22vh,165px);background:radial-gradient(ellipse at 50% 65%,#344e6b,#0a1421 72%);border:1px solid #ffffff17;border-radius:18px;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden}.preview:before{content:"GARAGE / 01";position:absolute;left:12px;top:10px;font-size:9px;font-weight:1000;letter-spacing:2px;color:#9bb4ca}.preview canvas{position:relative;width:100%;height:100%}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;max-height:26dvh;overflow:auto;margin:11px 0;touch-action:pan-y}
.car{border:1px solid #ffffff1e;background:linear-gradient(145deg,#13263a,#0a1623);color:#fff;border-radius:14px;padding:10px;text-align:left;font-size:12px;font-weight:900;touch-action:manipulation;transition:.15s}.car.sel{border:1px solid #ff6152;background:linear-gradient(145deg,#31465d,#17293c);box-shadow:0 0 0 1px #ff594744}.car span{display:block;color:#9eb6cc;font-size:10px;font-weight:700;margin-top:4px}
.start{width:100%;border:1px solid #ffb17c33;border-radius:15px;padding:15px;background:linear-gradient(100deg,#ff483f,#ff8b38);color:white;font-weight:1000;font-size:15px;letter-spacing:.6px;box-shadow:0 9px 22px #ff52352b;touch-action:manipulation}.foot{color:#94abc0;font-size:10px;text-align:center;margin-top:10px;letter-spacing:.4px}.hidden{display:none!important}
@media(max-height:640px){.card{padding:13px}.grid{max-height:22dvh}.bottomHud{bottom:105px}.speed{font-size:34px}.controls{bottom:8px}}
</style></head>
<body><canvas id="race"></canvas>
<div id="hud"><div class="top"><div class="brand">START<span>-CAR</span></div><div class="stat" id="pos">POSITION 1/5</div><div class="stat" id="zone">BUXORO</div><button class="pauseBtn" id="pause">Ⅱ</button></div><div class="meters"><div class="stat">⚡ NITRO <span id="nitroText">100%</span><div class="meter"><i id="nitroBar"></i></div></div></div><div class="speedBox"><div class="speed" id="speed">0</div><small>KM/H</small></div><div class="timeBox" id="timer">05:00</div><div class="bottomHud"><div class="chip" id="distance">TRACK · 0%</div><div class="chip" id="status">READY</div></div><div class="controls"><div class="ctrlGroup"><button class="btn steer" data-action="left">◀</button><button class="btn steer" data-action="right">▶</button></div><div class="ctrlGroup"><button class="btn brake" data-action="brake">BRAKE</button><button class="btn gas" data-action="gas">GAS ▲</button><button class="btn nitro" data-action="nitro">⚡</button></div></div></div>
<div id="menu"><div class="card"><h1 class="title">START<em>-CAR</em> <span style="font-size:16px">🏁</span></h1><p class="subtitle">RACING EXPERIENCE · Mashinangizni tanlang</p><div class="preview"><canvas id="preview" width="500" height="200"></canvas></div><div class="grid" id="cars"></div><button class="start" id="start">POYGANI BOSHLASH</button><p class="foot">BUKHARA CITY · RIVERSIDE · MOUNTAINS · NIGHT CITY</p></div></div>
<div id="pauseLayer" class="hidden"><div class="card"><h1 class="title" id="pauseTitle">PAUZA</h1><p class="subtitle">Poyga to‘xtatildi</p><button class="start" id="resume">DAVOM ETISH</button><button class="start" id="restart" style="margin-top:8px;background:linear-gradient(100deg,#31465c,#16283a)">QAYTA BOSHLASH</button></div></div>
<script>
(()=>{'use strict';
const canvas=document.getElementById('race'),ctx=canvas.getContext('2d'),preview=document.getElementById('preview'),pctx=preview.getContext('2d');
const cars=[['BMW M4',290,'#2e91ff',0],['Bugatti Chiron',420,'#d6a837',1],['Lamborghini Huracan',325,'#ffb72d',2],['Ferrari SF90',340,'#e83836',3],['Porsche 911 GT3',318,'#e8e9ec',4],['Mercedes AMG GT',310,'#39b9aa',5],['Audi R8',310,'#a55be0',6],['McLaren 720S',341,'#f67e32',7],['Nissan GT-R',315,'#f5f5f5',8],['Toyota Supra',280,'#e84b66',9]];
const botNames=['Asilbek','Sadoqat','Sevench','Ulugbek'],botColors=['#ffbd37','#56c7fa','#b884fa','#58d98a'];
let selected=0, W=0,H=0,dpr=1,started=false,paused=false,crashed=false,finished=false;
let speed=0,lane=0,steer=0,nitro=100,elapsed=0,remaining=300,dist=0,curve=0,shake=0,keys={},last=0;
let bots=botNames.map((name,i)=>({name,color:botColors[i],lane:[.45,-.5,.15,-.15][i],progress:500+i*600,speed:150+i*10}));
function resize(){dpr=Math.min(window.devicePixelRatio||1,1.5);W=innerWidth;H=innerHeight;canvas.width=W*dpr;canvas.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0)}
addEventListener('resize',resize);resize();
function drawCar(c,x,y,scale,player=false){
 c.save();c.translate(x,y);c.scale(scale,scale);
 let col=player?cars[selected][2]:(typeof arguments[5]==='string'?arguments[5]:'#4b8fdd');
 // ground shadow and perspective rear-view body
 c.fillStyle='#0008';c.beginPath();c.ellipse(0,10,30,43,0,0,Math.PI*2);c.fill();
 // wheels, tire sidewalls, rims
 c.fillStyle='#080b10';c.strokeStyle='#3d4650';c.lineWidth=2;
 for(let yy of [-24,19])for(let xx of [-21,21]){
   c.beginPath();c.roundRect(xx-5,yy-9,10,19,4);c.fill();c.stroke();
   c.fillStyle='#9ba8b3';c.beginPath();c.arc(xx,yy,3.3,0,Math.PI*2);c.fill();c.fillStyle='#080b10';
 }
 // wide lower rear bumper
 c.fillStyle='#10151b';c.beginPath();c.roundRect(-22,22,44,15,5);c.fill();
 c.fillStyle='#2d343c';c.beginPath();c.roundRect(-18,25,36,8,3);c.fill();
 // body silhouette with curved fenders
 c.shadowColor='#0008';c.shadowBlur=8;c.shadowOffsetY=2;
 c.fillStyle=col;c.beginPath();c.moveTo(-15,35);c.quadraticCurveTo(-25,28,-24,13);c.lineTo(-22,-18);c.quadraticCurveTo(-20,-34,-12,-40);c.quadraticCurveTo(0,-45,12,-40);c.quadraticCurveTo(20,-34,22,-18);c.lineTo(24,13);c.quadraticCurveTo(25,28,15,35);c.quadraticCurveTo(0,40,-15,35);c.closePath();c.fill();
 c.shadowBlur=0;c.shadowOffsetY=0;
 // side highlights and center body reflections
 c.fillStyle='#ffffff24';c.beginPath();c.moveTo(-18,10);c.quadraticCurveTo(-18,-25,-10,-35);c.lineTo(-6,-33);c.quadraticCurveTo(-11,-13,-10,12);c.lineTo(-14,29);c.closePath();c.fill();
 c.fillStyle='#00000020';c.beginPath();c.moveTo(10,-34);c.quadraticCurveTo(19,-20,19,8);c.lineTo(14,31);c.lineTo(7,34);c.quadraticCurveTo(13,4,9,-30);c.closePath();c.fill();
 // rear glass, roof and glass reflections
 c.fillStyle='#111d2b';c.beginPath();c.moveTo(-13,-26);c.quadraticCurveTo(-10,-36,-5,-36);c.lineTo(5,-36);c.quadraticCurveTo(11,-34,13,-26);c.lineTo(11,-10);c.lineTo(-11,-10);c.closePath();c.fill();
 c.fillStyle='#6cc7ed45';c.beginPath();c.moveTo(-10,-28);c.lineTo(-6,-34);c.lineTo(-3,-34);c.lineTo(-5,-13);c.lineTo(-10,-13);c.closePath();c.fill();
 c.strokeStyle='#080e16';c.lineWidth=2;c.beginPath();c.moveTo(-12,-8);c.lineTo(12,-8);c.stroke();
 // rear spoiler / trunk details
 c.fillStyle='#111820';c.beginPath();c.roundRect(-19,-5,38,5,2);c.fill();
 c.fillStyle='#ffffff22';c.fillRect(-13,0,26,2);
 // brake and tail lamps
 c.fillStyle='#ff3138';c.shadowColor='#ff2535';c.shadowBlur=player&&keys.brake?12:3;
 c.beginPath();c.roundRect(-18,15,8,7,2);c.roundRect(10,15,8,7,2);c.fill();c.shadowBlur=0;
 c.fillStyle='#ffb2b4';c.fillRect(-17,17,5,2);c.fillRect(12,17,5,2);
 // central plate and exhaust
 c.fillStyle='#d7e0e8';c.beginPath();c.roundRect(-7,25,14,5,1);c.fill();
 c.fillStyle='#090d12';c.beginPath();c.roundRect(-15,32,5,4,2);c.roundRect(10,32,5,4,2);c.fill();
 // nitro glow and flames when active
 if(player&&keys.nitro&&nitro>0){c.fillStyle='#33baff';c.shadowColor='#28aaff';c.shadowBlur=14;c.beginPath();c.moveTo(-9,36);c.lineTo(-6,52);c.lineTo(0,42);c.lineTo(6,52);c.lineTo(9,36);c.fill();c.shadowBlur=0}
 c.restore()
}
function previewCar(){pctx.clearRect(0,0,500,200);pctx.fillStyle='#0b1623';pctx.fillRect(0,0,500,200);let g=pctx.createRadialGradient(250,130,10,250,130,210);g.addColorStop(0,'#29445f');g.addColorStop(1,'#0b1623');pctx.fillStyle=g;pctx.fillRect(0,0,500,200);drawCar(pctx,250,115,1.8,true)}
const carGrid=document.getElementById('cars');carGrid.innerHTML=cars.map((c,i)=>'<button class="car'+(i===selected?' sel':'')+'" data-car="'+i+'">'+c[0]+'<span>'+c[1]+' km/h · tanlash</span></button>').join('');
carGrid.addEventListener('click',e=>{let b=e.target.closest('[data-car]');if(!b)return;selected=Number(b.dataset.car);carGrid.querySelectorAll('.car').forEach(x=>x.classList.toggle('sel',Number(x.dataset.car)===selected));previewCar()});previewCar();
function roadCenter(y){let normalized=(H-y)/Math.max(H,1);return Math.sin(dist*.00045+normalized*2.3)*W*.18+Math.sin(dist*.00013+normalized*6)*W*.06}
function zoneName(){let phase=dist%36000;if(phase<9000)return 'BUXORO ESKI SHAHAR';if(phase<18000)return 'SUV BO‘YI';if(phase<27000)return 'TOG‘LI HUDUD';return 'ZAMONAVIY SHAHAR'}
function road(){let horizon=H*.30;let phase=dist%36000;let zone=Math.floor(phase/9000);let sky=['#83bce1','#80d4df','#8aa5bf','#182f50'][zone],ground=['#b69a6e','#3a8795','#557d52','#47566d'][zone];let skyG=ctx.createLinearGradient(0,0,0,horizon);skyG.addColorStop(0,sky);skyG.addColorStop(1,'#d8d2c0');ctx.fillStyle=skyG;ctx.fillRect(0,0,W,horizon);ctx.fillStyle=ground;ctx.fillRect(0,horizon,W,H-horizon);
if(zone===0){for(let side of [-1,1])for(let i=0;i<10;i++){let x=side<0?i*W*.07:W*.72+i*W*.05,bw=W*.06,bh=horizon*(.3+(i%4)*.09);ctx.fillStyle=['#bd8c5a','#d2a878','#996d48'][i%3];ctx.fillRect(x,horizon-bh,bw,bh);ctx.fillStyle='#68472e';for(let j=0;j<3;j++)ctx.fillRect(x+bw*(.18+j*.26),horizon-bh*.58,bw*.13,bh*.18)}ctx.fillStyle='#e2c18b';ctx.fillRect(W*.48,horizon*.2,W*.04,horizon*.65);ctx.beginPath();ctx.arc(W*.5,horizon*.2,W*.04,Math.PI,0);ctx.fillStyle='#a56e43';ctx.fill()}
if(zone===1){ctx.fillStyle='#25879a';ctx.fillRect(0,horizon*.6,W,horizon*.4);for(let i=0;i<50;i++){ctx.fillStyle='#b9f0ed55';ctx.fillRect((i*77+dist*.1)%W,horizon*.65+(i*11)%Math.max(1,horizon*.3),20,2)}}
if(zone===2){for(let i=0;i<9;i++){let x=i*W*.13-W*.04;ctx.fillStyle=i%2?'#637e89':'#476b7c';ctx.beginPath();ctx.moveTo(x,horizon);ctx.lineTo(x+W*.08,horizon*.25+(i%4)*horizon*.05);ctx.lineTo(x+W*.19,horizon);ctx.fill()}}
if(zone===3){for(let side of [-1,1])for(let i=0;i<12;i++){let x=side<0?i*W*.07-W*.02:W*.7+i*W*.06,bw=W*.055,bh=horizon*(.3+(i%5)*.12);ctx.fillStyle=['#71899a','#536b81','#98aab4'][i%3];ctx.fillRect(x,horizon-bh,bw,bh);ctx.fillStyle='#d9f1ff';for(let j=0;j<5;j++)ctx.fillRect(x+bw*.14+j*bw*.16,horizon-bh*.75,bw*.07,bh*.04)}}
let segments=50;for(let i=0;i<segments;i++){let p=i/segments,q=(i+1)/segments,y1=horizon+p*(H-horizon),y2=horizon+q*(H-horizon),c1=W/2+roadCenter(y1),c2=W/2+roadCenter(y2),rw1=W*(.09+p*.39),rw2=W*(.09+q*.39);ctx.fillStyle=i%2?'#343a41':'#3c4249';ctx.beginPath();ctx.moveTo(c1-rw1,y1);ctx.lineTo(c1+rw1,y1);ctx.lineTo(c2+rw2,y2);ctx.lineTo(c2-rw2,y2);ctx.closePath();ctx.fill();ctx.fillStyle=i%2?'#f8f4ea':'#e94c43';ctx.fillRect(c1-rw1-7,y1,7,y2-y1+1);ctx.fillRect(c1+rw1,y1,7,y2-y1+1);if(i%5===0){ctx.fillStyle='#e8e5db';ctx.fillRect(c1-2,y1,4,y2-y1+1)}}
}
function botDraw(b){let relative=b.progress-dist;if(relative<0||relative>6500)return;let t=1-relative/6500,y=H*.3+t*H*.62,scale=.28+t*.62,x=W/2+roadCenter(y)+b.lane*W*(.36+t*.17);drawCar(ctx,x,y,scale,false,false,b.color);ctx.font='bold 11px system-ui';ctx.textAlign='center';ctx.fillStyle='#fff';ctx.fillText(b.name,x,y-scale*48)}
function update(dt){if(!started||paused||crashed||finished)return;elapsed+=dt;remaining=Math.max(0,300-elapsed);if(remaining<=0){finished=true;endScreen('VAQT TUGADI 🏁','Poyga vaqti tugadi');return}
let throttle=keys.gas?1:0,braking=keys.brake?1:0,n=keys.nitro&&nitro>0;
speed+=throttle*(cars[selected][1]*1.1)*dt;speed-= (5+speed*.03)*dt;if(braking)speed-=220*dt;if(n){speed+=220*dt;nitro=Math.max(0,nitro-36*dt)}else nitro=Math.min(100,nitro+10*dt);speed=Math.max(0,Math.min(cars[selected][1]*(n?1.15:1),speed));
let target=(keys.right?1:0)-(keys.left?1:0);steer+=(target-steer)*Math.min(1,dt*7);lane+=steer*(speed/Math.max(cars[selected][1],1))*dt*1.35;lane=Math.max(-1.15,Math.min(1.15,lane));dist+=speed*dt*.9;
bots.forEach(b=>{b.progress+=b.speed*dt; if(b.progress-dist>6200)b.progress=dist+400+Math.random()*1500;b.lane=Math.sin(elapsed*.45+b.speed)*.45});
for(let b of bots){let gap=b.progress-dist;if(Math.abs(gap)<230&&Math.abs(b.lane-lane)<.28){crashed=true;speed=0;keys={};document.getElementById('status').textContent='AVARIYA';endScreen('AVARIYA 💥','Mashina to‘qnashdi. Qayta boshlang.');break}}
if(Math.abs(lane)>1.02)speed=Math.max(0,speed-55*dt);
document.getElementById('speed').textContent=Math.round(speed);document.getElementById('nitroText').textContent=Math.round(nitro)+'%';document.getElementById('nitroBar').style.width=nitro+'%';document.getElementById('timer').textContent=Math.floor(remaining/60).toString().padStart(2,'0')+':'+Math.floor(remaining%60).toString().padStart(2,'0');document.getElementById('distance').textContent='TRASSA '+Math.min(100,Math.floor(dist/27000*100))+'%';document.getElementById('zone').textContent=zoneName();document.getElementById('pos').textContent='POS '+(1+bots.filter(b=>b.progress>dist).length)+'/5';document.getElementById('status').textContent=n?'NITRO':speed>120?'RACE':'READY'
}
function endScreen(title,msg){document.getElementById('pauseTitle').textContent=title;document.querySelector('#pauseLayer .subtitle').textContent=msg;document.getElementById('pauseLayer').classList.remove('hidden')}
function startRace(){started=true;paused=false;crashed=false;finished=false;elapsed=0;remaining=300;dist=0;speed=0;lane=0;steer=0;nitro=100;keys={};bots.forEach((b,i)=>{b.progress=500+i*600;b.lane=[.4,-.5,.15,-.15][i]});document.getElementById('menu').classList.add('hidden');document.getElementById('pauseLayer').classList.add('hidden');document.getElementById('status').textContent='RACE';}
document.getElementById('start').addEventListener('click',startRace);document.getElementById('pause').addEventListener('click',()=>{if(!started||finished||crashed)return;paused=!paused;if(paused)endScreen('PAUZA ⏸','Poyga to‘xtatildi');else document.getElementById('pauseLayer').classList.add('hidden')});document.getElementById('resume').addEventListener('click',()=>{paused=false;document.getElementById('pauseLayer').classList.add('hidden')});document.getElementById('restart').addEventListener('click',()=>{document.getElementById('pauseLayer').classList.add('hidden');startRace()});
document.querySelectorAll('[data-action]').forEach(b=>{let action=b.dataset.action;const down=e=>{e.preventDefault();keys[action]=true;b.classList.add('active');try{b.setPointerCapture(e.pointerId)}catch(_){}};const up=e=>{if(e)e.preventDefault();keys[action]=false;b.classList.remove('active')};b.addEventListener('pointerdown',down);['pointerup','pointercancel','lostpointercapture'].forEach(ev=>b.addEventListener(ev,up));b.addEventListener('click',e=>e.preventDefault());});
addEventListener('keydown',e=>{let map={ArrowLeft:'left',a:'left',ArrowRight:'right',d:'right',ArrowUp:'gas',w:'gas',ArrowDown:'brake',s:'brake',Shift:'nitro',Escape:'pause'};if(map[e.key]){e.preventDefault();keys[map[e.key]]=true;if(e.key==='Escape'&&started){paused=true;endScreen('PAUZA ⏸','Poyga to‘xtatildi')}}});addEventListener('keyup',e=>{let map={ArrowLeft:'left',a:'left',ArrowRight:'right',d:'right',ArrowUp:'gas',w:'gas',ArrowDown:'brake',s:'brake',Shift:'nitro'};if(map[e.key])keys[map[e.key]]=false});
function frame(t){let dt=Math.min(.04,Math.max(0,(t-last)/1000||0));last=t;update(dt);ctx.save();if(shake)ctx.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);ctx.clearRect(0,0,W,H);road();bots.forEach(botDraw);let py=H*.80,px=W/2+roadCenter(py)+lane*W*.33;drawCar(ctx,px,py,Math.max(.75,Math.min(1.3,H/700)),true);ctx.restore();requestAnimationFrame(frame)}
requestAnimationFrame(frame);
})();
</script></body></html>
