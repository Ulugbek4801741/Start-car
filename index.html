<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#090e19"><title>START-CAR Racing</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#090e19;color:#f4f7fb;font-family:system-ui,Arial;overflow:hidden;touch-action:none}
#game{display:block;width:100vw;height:100vh;background:linear-gradient(#172c49,#101a2b)}
.top{position:absolute;top:14px;left:14px;right:14px;display:flex;justify-content:space-between;align-items:center;z-index:2}
.brand{font-weight:900;letter-spacing:2px;font-size:20px}.brand span{color:#ff4141}
.pill{background:#101927cc;border:1px solid #ffffff25;border-radius:12px;padding:8px 12px;font-weight:700}
#overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:#070b12a8}
.panel{width:min(90%,380px);padding:26px;border:1px solid #ffffff20;background:#101927ee;border-radius:22px;text-align:center;box-shadow:0 20px 60px #0007}
.panel h1{margin:0 0 8px;font-size:28px}.car-select{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin:12px 0;max-height:34vh;overflow:auto}.car-option{padding:9px 7px;font-size:12px}.race-duration{width:100%;background:#1c2a3e;color:#fff;border:1px solid #ffffff30;border-radius:10px;padding:10px;margin:0 0 10px;font-weight:700}.car-option{background:#1c2a3e;border:1px solid #ffffff20;border-radius:12px;padding:10px;text-align:left;color:white;font-size:14px}.car-option.selected{border:2px solid #ff4141;background:#28364a}.car-option strong{display:block}.car-option small{color:#b7c5d6}.panel p{color:#b8c6d8;line-height:1.5}
button{border:0;border-radius:14px;padding:14px 18px;background:#ff3d3d;color:white;font-weight:900;font-size:16px}
.controls{position:absolute;z-index:10;bottom:18px;left:0;right:0;display:flex;justify-content:space-between;padding:0 18px;pointer-events:none}
.group{display:flex;gap:12px;pointer-events:auto;touch-action:none}.control{width:72px;height:72px;pointer-events:auto;background:#182437cc;border:1px solid #ffffff33;border-radius:18px;color:white;font-weight:800;touch-action:none;user-select:none}
.control.active{background:#ff3d3ddd}.small{font-size:12px;color:#b7c5d6}

#speed{font-variant-numeric:tabular-nums;box-shadow:0 3px 16px #0005} .controls .control{box-shadow:0 8px 22px #0006;backdrop-filter:blur(6px)}
</style></head>
<body><canvas id="game"></canvas>
<div class="top"><div class="brand">START<span>-CAR</span></div><div class="pill" id="speed">0 km/h</div><div class="pill" id="raceHud">15:00 · BOT 4</div></div>
<div id="overlay"><div class="panel"><h1>START-CAR 🏁</h1><p>Avtomobilni tanlang va poygani boshlang.</p><div class="car-select" id="carSelect"><button class="car-option selected" data-car="bmw"><strong>BMW M4</strong><small>280 km/h</small></button><button class="car-option" data-car="bugatti"><strong>Bugatti Chiron</strong><small>420 km/h</small></button><button class="car-option" data-car="lambo"><strong>Lamborghini Huracán</strong><small>330 km/h</small></button><button class="car-option" data-car="ferrari"><strong>Ferrari 488</strong><small>325 km/h</small></button><button class="car-option" data-car="porsche"><strong>Porsche 911</strong><small>300 km/h</small></button><button class="car-option" data-car="audi"><strong>Audi R8</strong><small>310 km/h</small></button><button class="car-option" data-car="mclaren"><strong>McLaren 720S</strong><small>340 km/h</small></button><button class="car-option" data-car="nissan"><strong>Nissan GT-R</strong><small>315 km/h</small></button><button class="car-option" data-car="mercedes"><strong>Mercedes AMG GT</strong><small>310 km/h</small></button><button class="car-option" data-car="koenigsegg"><strong>Koenigsegg Jesko</strong><small>450 km/h</small></button></div><select class="race-duration" id="duration"><option value="900">Poyga vaqti: 15 daqiqa</option><option value="1200">Poyga vaqti: 20 daqiqa</option></select><button id="start">RACE START</button><p class="small">Birinchi web sinov • offline poyga prototipi</p></div></div>
<div class="controls"><div class="group"><button class="control" data-key="left">◀</button><button class="control" data-key="right">▶</button></div><div class="group"><button class="control" data-key="brake">BRAKE</button><button class="control" data-key="gas">GAS ▲</button></div></div>
<script>
const canvas=document.querySelector('#game'),ctx=canvas.getContext('2d');let w,h,dpr,started=false,speed=0,playerX=0,roadOffset=0,trackProgress=0,raceSeconds=900,raceElapsed=0,finishReached=false,keys={left:false,right:false,gas:false,brake:false},last=0;let selectedCar='bmw';const cars={bmw:{name:'BMW M4',color:'#2779e8',max:280},bugatti:{name:'Bugatti Chiron',color:'#16a6a2',max:420},lambo:{name:'Lamborghini Huracán',color:'#f2c21b',max:330},ferrari:{name:'Ferrari 488',color:'#e33232',max:325},porsche:{name:'Porsche 911',color:'#e6e6e6',max:300},audi:{name:'Audi R8',color:'#9b3030',max:310},mclaren:{name:'McLaren 720S',color:'#f28b20',max:340},nissan:{name:'Nissan GT-R',color:'#505b75',max:315},mercedes:{name:'Mercedes AMG GT',color:'#c3c6ca',max:310},koenigsegg:{name:'Koenigsegg Jesko',color:'#b4e35a',max:450}};let bots=[{x:-.18,progress:180,speed:180,color:'#d64040'},{x:.18,progress:520,speed:205,color:'#f2c21b'},{x:-.34,progress:900,speed:195,color:'#a65de0'},{x:.34,progress:1200,speed:215,color:'#16a6a2'}];
function resize(){dpr=Math.min(devicePixelRatio||1,2);w=innerWidth;h=innerHeight;canvas.width=w*dpr;canvas.height=h*dpr;ctx.setTransform(dpr,0,0,dpr,0,0)}addEventListener('resize',resize);resize();
function drawCar(x,y,scale,color){ctx.save();ctx.translate(x,y);ctx.scale(scale,scale);ctx.shadowColor='#0009';ctx.shadowBlur=18;ctx.shadowOffsetY=10;ctx.fillStyle='#07090c';ctx.fillRect(-23,-30,10,24);ctx.fillRect(13,-30,10,24);ctx.fillRect(-23,12,10,24);ctx.fillRect(13,12,10,24);ctx.shadowBlur=0;ctx.shadowOffsetY=0;ctx.fillStyle=color;ctx.beginPath();ctx.moveTo(-17,30);ctx.quadraticCurveTo(-22,18,-18,-20);ctx.quadraticCurveTo(-16,-38,-9,-40);ctx.lineTo(9,-40);ctx.quadraticCurveTo(16,-36,19,-20);ctx.quadraticCurveTo(22,18,17,30);ctx.quadraticCurveTo(0,38,-17,30);ctx.fill();ctx.fillStyle='#172838';ctx.beginPath();ctx.moveTo(-12,-25);ctx.quadraticCurveTo(-10,-33,-6,-33);ctx.lineTo(6,-33);ctx.quadraticCurveTo(11,-30,12,-25);ctx.lineTo(11,-9);ctx.quadraticCurveTo(0,-5,-11,-9);ctx.closePath();ctx.fill();ctx.fillStyle='#9fdcff';ctx.globalAlpha=.65;ctx.fill();ctx.globalAlpha=1;ctx.fillStyle='#25394c';ctx.beginPath();ctx.roundRect(-12,-4,24,17,3);ctx.fill();ctx.fillStyle='#111a24';ctx.fillRect(-11,15,22,6);ctx.fillStyle='#fff3bc';ctx.fillRect(-14,-36,7,5);ctx.fillRect(7,-36,7,5);ctx.fillStyle='#f04440';ctx.fillRect(-13,26,6,3);ctx.fillRect(7,26,6,3);ctx.fillStyle='#10151b';ctx.fillRect(-8,22,16,2);ctx.restore()}
function curveAt(y){const ahead=(1-y/Math.max(h,1))*760;return Math.sin((trackProgress+ahead)/380)*w*.20+Math.sin((trackProgress+ahead)/185)*w*.055}
function drawFinishLine(w,h,progress){let y=h*.12+(h*.88)*progress;let roadWidth=w*(.5+.46*progress);let left=w/2+curveAt(y)-roadWidth/2;let cell=Math.max(12,Math.min(32,roadWidth/12));ctx.save();ctx.translate(left,y);for(let row=0;row<2;row++){for(let col=0;col<Math.ceil(roadWidth/cell);col++){ctx.fillStyle=(row+col)%2?'#fff':'#111';ctx.fillRect(col*cell,row*cell,cell,cell)}}ctx.restore();}
function road(){let horizon=h*.12,bottom=h,segments=48;let sky=ctx.createLinearGradient(0,0,0,horizon+40);sky.addColorStop(0,'#5b9fcb');sky.addColorStop(1,'#c8e4f1');ctx.fillStyle=sky;ctx.fillRect(0,0,w,horizon+30);ctx.fillStyle='#6c9a5c';ctx.fillRect(0,horizon,w,h-horizon);ctx.fillStyle='#89b56c';ctx.fillRect(0,horizon+12,w,h-horizon);for(let i=0;i<segments;i++){let y1=horizon+(i/segments)*(bottom-horizon),y2=horizon+((i+1)/segments)*(bottom-horizon);let c1=w/2+curveAt(y1),c2=w/2+curveAt(y2),half1=w*(.25+.23*(i/segments)),half2=w*(.25+.23*((i+1)/segments));ctx.fillStyle=i%2?'#5b606a':'#646a74';ctx.beginPath();ctx.moveTo(c1-half1,y1);ctx.lineTo(c1+half1,y1);ctx.lineTo(c2+half2,y2);ctx.lineTo(c2-half2,y2);ctx.closePath();ctx.fill();ctx.fillStyle=i%2?'#fff':'#e84a45';ctx.fillRect(c1-half1-12,y1,12,Math.max(4,y2-y1));ctx.fillRect(c1+half1,y1,12,Math.max(4,y2-y1));if(i%3===0){let scale=.25+i/segments*.9;ctx.fillStyle='#315f36';ctx.beginPath();ctx.arc(c1-half1-38*scale,y1,12*scale,0,Math.PI*2);ctx.arc(c1+half1+38*scale,y1,12*scale,0,Math.PI*2);ctx.fill();ctx.fillStyle='#76523a';ctx.fillRect(c1-half1-40*scale,y1,4*scale,10*scale);ctx.fillRect(c1+half1+36*scale,y1,4*scale,10*scale);}}ctx.strokeStyle='#f5f2e8';ctx.lineWidth=Math.max(3,w*.006);ctx.setLineDash([Math.max(22,h*.05),Math.max(18,h*.035)]);ctx.lineDashOffset=-roadOffset;ctx.beginPath();for(let i=0;i<=segments;i++){let y=horizon+(i/segments)*(bottom-horizon),c=w/2+curveAt(y);if(i===0)ctx.moveTo(c,y);else ctx.lineTo(c,y)}ctx.stroke();ctx.setLineDash([]);ctx.fillStyle='#ffffff12';for(let i=0;i<18;i++){let y=horizon+(i/18)*(h-horizon),c=w/2+curveAt(y),half=w*(.25+.23*(i/18));ctx.fillRect(c-half+Math.sin(i*91)*30,y,2,3);ctx.fillRect(c+half-Math.cos(i*31)*40,y,2,3);}}
document.querySelectorAll('.car-option').forEach(btn=>btn.onclick=()=>{selectedCar=btn.dataset.car;document.querySelectorAll('.car-option').forEach(x=>x.classList.toggle('selected',x===btn));});
function drawBots(){bots.forEach(b=>{let phase=((b.progress+trackProgress*.65)%2400)/2400;let y=h*.15+phase*h*.72;let roadHalf=w*(.25+.23*phase);let cx=w/2+curveAt(y)+b.x*roadHalf;drawCar(cx,y,Math.max(.22,Math.min(.75,.22+phase*.55)),b.color);});}
function frame(t){let dt=Math.min((t-last)/1000,.05);last=t;if(started){if(keys.gas)speed=Math.min(cars[selectedCar].max,speed+95*dt);else speed=Math.max(0,speed-15*dt);if(keys.brake)speed=Math.max(0,speed-170*dt);if(keys.left)playerX-=210*dt;if(keys.right)playerX+=210*dt;playerX=Math.max(-w*.28,Math.min(w*.28,playerX));roadOffset=(roadOffset+speed*dt*2)%64;trackProgress+=speed*dt;raceElapsed+=dt;bots.forEach(b=>b.progress+=b.speed*dt);raceSeconds=Math.max(0,raceSeconds-dt);if(raceSeconds<=0&&!finishReached){finishReached=true;started=false;speed=0;document.querySelector('#overlay').style.display='flex';document.querySelector('.panel h1').textContent='FINISH! 🏁';document.querySelector('.panel p').textContent='Poyga tugadi! Botlar bilan poyga yakunlandi.';document.querySelector('#start').textContent='RESTART';}}
ctx.clearRect(0,0,w,h);road();drawBots();let px=w/2+curveAt(h*.78)+playerX,py=h*.78;drawCar(px,py,Math.max(.65,Math.min(1.2,h/700)),cars[selectedCar].color);document.querySelector('#speed').textContent=Math.round(speed)+' km/h';let mm=Math.floor(raceSeconds/60),ss=Math.floor(raceSeconds%60);document.querySelector('#raceHud').textContent=mm+':'+String(ss).padStart(2,'0')+' · BOT '+bots.length;requestAnimationFrame(frame)}requestAnimationFrame(frame);
document.querySelector('#start').addEventListener('click',()=>{started=true;finishReached=false;raceSeconds=Number(document.querySelector('#duration').value);raceElapsed=0;trackProgress=0;playerX=0;speed=0;bots.forEach((b,i)=>b.progress=160+i*370);document.querySelector('.panel h1').textContent='START-CAR 🏁';document.querySelector('.panel p').textContent='Avtomobilni tanlang va poygani boshlang.';document.querySelector('#start').textContent='RACE START';document.querySelector('#overlay').style.display='none';});
document.querySelectorAll('[data-key]').forEach(b=>{const k=b.dataset.key;const press=e=>{e.preventDefault();keys[k]=true;b.classList.add('active');try{b.setPointerCapture(e.pointerId)}catch(_){}};const release=e=>{if(e)e.preventDefault();keys[k]=false;b.classList.remove('active')};b.addEventListener('pointerdown',press);['pointerup','pointercancel','lostpointercapture'].forEach(ev=>b.addEventListener(ev,release));b.addEventListener('contextmenu',e=>e.preventDefault());});
addEventListener('keydown',e=>{if(e.key==='ArrowLeft'||e.key==='a')keys.left=true;if(e.key==='ArrowRight'||e.key==='d')keys.right=true;if(e.key==='ArrowUp'||e.key==='w')keys.gas=true;if(e.key==='ArrowDown'||e.key==='s')keys.brake=true});
addEventListener('keyup',e=>{if(e.key==='ArrowLeft'||e.key==='a')keys.left=false;if(e.key==='ArrowRight'||e.key==='d')keys.right=false;if(e.key==='ArrowUp'||e.key==='w')keys.gas=false;if(e.key==='ArrowDown'||e.key==='s')keys.brake=false});
</script></body></html>
