<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#090e19"><title>START-CAR Racing</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#090e19;color:#f4f7fb;font-family:system-ui,Arial;overflow:hidden;touch-action:none}
#game{display:block;width:100vw;height:100vh;background:linear-gradient(#172c49,#101a2b)}
.top{position:absolute;top:14px;left:14px;right:14px;display:flex;justify-content:space-between;align-items:center;z-index:2}
.brand{font-weight:900;letter-spacing:2px;font-size:20px}.brand span{color:#ff4141}
.pill{background:#101927cc;border:1px solid #ffffff25;border-radius:12px;padding:8px 12px;font-weight:700}
#overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:#070b12a8}
.panel{width:min(90%,380px);padding:26px;border:1px solid #ffffff20;background:#101927ee;border-radius:22px;text-align:center;box-shadow:0 20px 60px #0007}
.panel h1{margin:0 0 8px;font-size:28px}.car-select{display:grid;grid-template-columns:1fr;gap:8px;margin:14px 0}.car-option{background:#1c2a3e;border:1px solid #ffffff20;border-radius:12px;padding:10px;text-align:left;color:white;font-size:14px}.car-option.selected{border:2px solid #ff4141;background:#28364a}.car-option strong{display:block}.car-option small{color:#b7c5d6}.panel p{color:#b8c6d8;line-height:1.5}
button{border:0;border-radius:14px;padding:14px 18px;background:#ff3d3d;color:white;font-weight:900;font-size:16px}
.controls{position:absolute;z-index:10;bottom:18px;left:0;right:0;display:flex;justify-content:space-between;padding:0 18px;pointer-events:none}
.group{display:flex;gap:12px;pointer-events:auto;touch-action:none}.control{width:72px;height:72px;pointer-events:auto;background:#182437cc;border:1px solid #ffffff33;border-radius:18px;color:white;font-weight:800;touch-action:none;user-select:none}
.control.active{background:#ff3d3ddd}.small{font-size:12px;color:#b7c5d6}
</style></head>
<body><canvas id="game"></canvas>
<div class="top"><div class="brand">START<span>-CAR</span></div><div class="pill" id="speed">0 km/h</div></div>
<div id="overlay"><div class="panel"><h1>START-CAR 🏁</h1><p>Avtomobilni tanlang va poygani boshlang.</p><div class="car-select" id="carSelect"><button class="car-option selected" data-car="bmw"><strong>BMW M4 Competition</strong><small>280 km/h • tez boshqaruv</small></button><button class="car-option" data-car="bugatti"><strong>Bugatti Chiron</strong><small>420 km/h • eng yuqori tezlik</small></button><button class="car-option" data-car="lambo"><strong>Lamborghini Huracán</strong><small>330 km/h • kuchli tezlanish</small></button></div><button id="start">RACE START</button><p class="small">Birinchi web sinov • offline poyga prototipi</p></div></div>
<div class="controls"><div class="group"><button class="control" data-key="left">◀</button><button class="control" data-key="right">▶</button></div><div class="group"><button class="control" data-key="brake">BRAKE</button><button class="control" data-key="gas">GAS ▲</button></div></div>
<script>
const canvas=document.querySelector('#game'),ctx=canvas.getContext('2d');let w,h,dpr,started=false,speed=0,playerX=0,roadOffset=0,trackProgress=0,finishDistance=1800,finishReached=false,keys={left:false,right:false,gas:false,brake:false},last=0;let selectedCar='bmw';const cars={bmw:{name:'BMW M4 Competition',color:'#2779e8',max:280},bugatti:{name:'Bugatti Chiron',color:'#16a6a2',max:420},lambo:{name:'Lamborghini Huracán',color:'#f2c21b',max:330}};
function resize(){dpr=Math.min(devicePixelRatio||1,2);w=innerWidth;h=innerHeight;canvas.width=w*dpr;canvas.height=h*dpr;ctx.setTransform(dpr,0,0,dpr,0,0)}addEventListener('resize',resize);resize();
function drawCar(x,y,scale,color){ctx.save();ctx.translate(x,y);ctx.scale(scale,scale);ctx.fillStyle='#080b12';ctx.fillRect(-21,-32,9,23);ctx.fillRect(12,-32,9,23);ctx.fillRect(-21,12,9,23);ctx.fillRect(12,12,9,23);ctx.fillStyle=color;ctx.beginPath();ctx.roundRect(-16,-36,32,72,8);ctx.fill();ctx.fillStyle='#9be3ff';ctx.beginPath();ctx.roundRect(-11,-22,22,17,4);ctx.fill();ctx.fillStyle='#222e3f';ctx.fillRect(-11,3,22,18);ctx.fillStyle='#ffe79a';ctx.fillRect(-13,-34,7,4);ctx.fillRect(6,-34,7,4);ctx.restore()}
function curveAt(y){const ahead=(1-y/Math.max(h,1))*760;return Math.sin((trackProgress+ahead)/380)*w*.20+Math.sin((trackProgress+ahead)/185)*w*.055}
function drawFinishLine(w,h,progress){let y=h*.12+(h*.88)*progress;let roadWidth=w*(.5+.46*progress);let left=w/2+curveAt(y)-roadWidth/2;let cell=Math.max(12,Math.min(32,roadWidth/12));ctx.save();ctx.translate(left,y);for(let row=0;row<2;row++){for(let col=0;col<Math.ceil(roadWidth/cell);col++){ctx.fillStyle=(row+col)%2?'#fff':'#111';ctx.fillRect(col*cell,row*cell,cell,cell)}}ctx.restore();}
function road(){let horizon=h*.12,bottom=h,segments=36;ctx.fillStyle='#1a3828';ctx.fillRect(0,horizon,w,h-horizon);for(let i=0;i<segments;i++){let y1=horizon+(i/segments)*(bottom-horizon),y2=horizon+((i+1)/segments)*(bottom-horizon);let c1=w/2+curveAt(y1),c2=w/2+curveAt(y2),half1=w*(.25+.23*(i/segments)),half2=w*(.25+.23*((i+1)/segments));ctx.fillStyle='#515765';ctx.beginPath();ctx.moveTo(c1-half1,y1);ctx.lineTo(c1+half1,y1);ctx.lineTo(c2+half2,y2);ctx.lineTo(c2-half2,y2);ctx.closePath();ctx.fill();ctx.fillStyle=i%2?'#f7f7f7':'#e83a3a';ctx.fillRect(c1-half1-10,y1,10,Math.max(4,y2-y1));ctx.fillRect(c1+half1,y1,10,Math.max(4,y2-y1));}ctx.strokeStyle='#f4f4f4';ctx.lineWidth=Math.max(4,w*.007);ctx.setLineDash([Math.max(28,h*.055),Math.max(24,h*.04)]);ctx.lineDashOffset=-roadOffset;ctx.beginPath();for(let i=0;i<=segments;i++){let y=horizon+(i/segments)*(bottom-horizon),c=w/2+curveAt(y);if(i===0)ctx.moveTo(c,y);else ctx.lineTo(c,y)}ctx.stroke();ctx.setLineDash([])}
document.querySelectorAll('.car-option').forEach(btn=>btn.onclick=()=>{selectedCar=btn.dataset.car;document.querySelectorAll('.car-option').forEach(x=>x.classList.toggle('selected',x===btn));});
function frame(t){let dt=Math.min((t-last)/1000,.05);last=t;if(started){if(keys.gas)speed=Math.min(cars[selectedCar].max,speed+110*dt);else speed=Math.max(0,speed-22*dt);if(keys.brake)speed=Math.max(0,speed-180*dt);if(keys.left)playerX-=210*dt;if(keys.right)playerX+=210*dt;playerX=Math.max(-w*.25,Math.min(w*.25,playerX));roadOffset=(roadOffset+speed*dt*2)%64;trackProgress+=speed*dt;finishDistance-=speed*dt/3.6;if(finishDistance<=0&&!finishReached){finishReached=true;started=false;speed=0;document.querySelector('#overlay').style.display='flex';document.querySelector('.panel h1').textContent='FINISH! 🏁';document.querySelector('.panel p').textContent='Poyga yakunlandi! Qayta poyga uchun avtomobil tanlang.';document.querySelector('#start').textContent='RESTART';}}
ctx.clearRect(0,0,w,h);road();if(finishDistance<420){drawFinishLine(w,h,Math.max(0,finishDistance/420));}let px=w/2+curveAt(h*.78)+playerX,py=h*.78;drawCar(px,py,Math.max(.65,Math.min(1.2,h/700)),cars[selectedCar].color);document.querySelector('#speed').textContent=Math.round(speed)+' km/h';requestAnimationFrame(frame)}requestAnimationFrame(frame);
document.querySelector('#start').addEventListener('click',()=>{started=true;finishReached=false;finishDistance=1800;trackProgress=0;playerX=0;speed=0;document.querySelector('.panel h1').textContent='START-CAR 🏁';document.querySelector('.panel p').textContent='Avtomobilni tanlang va poygani boshlang.';document.querySelector('#start').textContent='RACE START';document.querySelector('#overlay').style.display='none';});
document.querySelectorAll('[data-key]').forEach(b=>{const k=b.dataset.key;const press=e=>{e.preventDefault();keys[k]=true;b.classList.add('active');try{b.setPointerCapture(e.pointerId)}catch(_){}};const release=e=>{if(e)e.preventDefault();keys[k]=false;b.classList.remove('active')};b.addEventListener('pointerdown',press);['pointerup','pointercancel','lostpointercapture'].forEach(ev=>b.addEventListener(ev,release));b.addEventListener('contextmenu',e=>e.preventDefault());});
addEventListener('keydown',e=>{if(e.key==='ArrowLeft'||e.key==='a')keys.left=true;if(e.key==='ArrowRight'||e.key==='d')keys.right=true;if(e.key==='ArrowUp'||e.key==='w')keys.gas=true;if(e.key==='ArrowDown'||e.key==='s')keys.brake=true});
addEventListener('keyup',e=>{if(e.key==='ArrowLeft'||e.key==='a')keys.left=false;if(e.key==='ArrowRight'||e.key==='d')keys.right=false;if(e.key==='ArrowUp'||e.key==='w')keys.gas=false;if(e.key==='ArrowDown'||e.key==='s')keys.brake=false});
</script></body></html>
